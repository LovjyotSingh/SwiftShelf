name: SwiftShelf CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "mongodb+srv://mockuser:mockpass@cluster0.mock.mongodb.net/swiftshelf?retryWrites=true&w=majority"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-test-jwt-secret-key-at-least-32-chars-long"
      GEMINI_API_KEY: "dummy_gemini_api_key_for_ci"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Build
        run: npm run build

