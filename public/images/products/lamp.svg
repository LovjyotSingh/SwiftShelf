<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="lampLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgL)"/>

  <!-- Asymmetrical Light Cone Projection -->
  <polygon points="120,240 680,240 760,650 40,650" fill="url(#lampLightGrad)"/>

  <g filter="url(#shadowL)" transform="translate(400, 360)">
    <!-- Lightbar Housing -->
    <rect x="-300" y="-140" width="600" height="28" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="4"/>
    <rect x="-280" y="-120" width="560" height="12" rx="4" fill="#fef08a"/>

    <!-- Center Support Clamp Mount -->
    <rect x="-30" y="-112" width="60" height="80" rx="10" fill="#0f172a" stroke="#475569" stroke-width="3"/>

    <!-- Wireless Magnetic Rotary Controller Knob (Desktop Puck) -->
    <g transform="translate(0, 220)">
      <ellipse cx="0" cy="0" rx="80" ry="25" fill="#090d16" stroke="#38bdf8" stroke-width="4"/>
      <ellipse cx="0" cy="-10" rx="80" ry="25" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
      <circle cx="0" cy="-10" r="14" fill="#38bdf8"/>
      <text x="0" y="50" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3">AURA HALO • WIRELESS ROTARY DIAL</text>
    </g>
  </g>
</svg>
