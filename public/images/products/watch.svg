<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgWatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgWatch)"/>

  <g filter="url(#shadowW)" transform="translate(400, 400)">
    <!-- Fluororubber Strap Top -->
    <rect x="-70" y="-340" width="140" height="180" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <line x1="-50" y1="-280" x2="50" y2="-280" stroke="#475569" stroke-width="3"/>
    <line x1="-50" y1="-240" x2="50" y2="-240" stroke="#475569" stroke-width="3"/>

    <!-- Fluororubber Strap Bottom -->
    <rect x="-70" y="160" width="140" height="180" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <line x1="-50" y1="220" x2="50" y2="220" stroke="#475569" stroke-width="3"/>
    <line x1="-50" y1="260" x2="50" y2="260" stroke="#475569" stroke-width="3"/>

    <!-- Titanium Lug Brackets -->
    <rect x="-95" y="-190" width="190" height="40" rx="10" fill="url(#titaniumGrad)"/>
    <rect x="-95" y="150" width="190" height="40" rx="10" fill="url(#titaniumGrad)"/>

    <!-- Outer Titanium Watch Body Case -->
    <circle cx="0" cy="0" r="180" fill="url(#titaniumGrad)" stroke="#1e293b" stroke-width="8"/>
    <circle cx="0" cy="0" r="165" fill="#0f172a"/>

    <!-- Digital Crown Knob -->
    <rect x="175" y="-35" width="22" height="70" rx="8" fill="url(#titaniumGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Sapphire Bezel Ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <!-- OLED Screen -->
    <circle cx="0" cy="0" r="145" fill="#020617"/>

    <!-- Digital Watch Face HUD -->
    <text x="0" y="-30" text-anchor="middle" fill="#f8fafc" font-family="Outfit, sans-serif" font-size="52" font-weight="900" letter-spacing="2">10:42</text>
    <text x="0" y="10" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="4">AM • SAT 15</text>

    <!-- Telemetry Ring Indicators -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e293b" stroke-width="8"/>
    <path d="M 0 -120 A 120 120 0 1 1 -85 85" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
    <path d="M 0 -120 A 120 120 0 0 1 110 -45" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>

    <!-- Health Stats Text -->
    <text x="0" y="65" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">⚡ 72 BPM • 99% SpO2</text>
    <text x="0" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="semibold">14,280 STEPS • 100m GPS</text>
  </g>
</svg>
