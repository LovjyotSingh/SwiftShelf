<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgKbd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cncAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowK" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgKbd)"/>

  <g filter="url(#shadowK)" transform="translate(400, 400) rotate(-10)">
    <!-- CNC 6063 Aluminum Chassis Base -->
    <rect x="-310" y="-140" width="620" height="280" rx="20" fill="url(#cncAlum)" stroke="#64748b" stroke-width="5"/>

    <!-- Keycap Plate Recess -->
    <rect x="-290" y="-120" width="580" height="240" rx="12" fill="#07090e" stroke="#38bdf8" stroke-width="2"/>

    <!-- Row 1 Keycaps -->
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5" rx="4">
      <rect x="-280" y="-110" width="34" height="38"/>
      <rect x="-240" y="-110" width="34" height="38"/>
      <rect x="-200" y="-110" width="34" height="38"/>
      <rect x="-160" y="-110" width="34" height="38"/>
      <rect x="-120" y="-110" width="34" height="38"/>
      <rect x="-80"  y="-110" width="34" height="38"/>
      <rect x="-40"  y="-110" width="34" height="38"/>
      <rect x="0"    y="-110" width="34" height="38"/>
      <rect x="40"   y="-110" width="34" height="38"/>
      <rect x="80"   y="-110" width="34" height="38"/>
      <rect x="120"  y="-110" width="34" height="38"/>
      <rect x="160"  y="-110" width="34" height="38"/>
      <rect x="200"  y="-110" width="34" height="38"/>
      <rect x="240"  y="-110" width="44" height="38" fill="#6366f1"/>
    </g>

    <!-- Row 2 Keycaps -->
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="-280" y="-65" width="48" height="38" fill="#38bdf8"/>
      <rect x="-226" y="-65" width="34" height="38"/>
      <rect x="-186" y="-65" width="34" height="38"/>
      <rect x="-146" y="-65" width="34" height="38"/>
      <rect x="-106" y="-65" width="34" height="38"/>
      <rect x="-66"  y="-65" width="34" height="38"/>
      <rect x="-26"  y="-65" width="34" height="38"/>
      <rect x="14"   y="-65" width="34" height="38"/>
      <rect x="54"   y="-65" width="34" height="38"/>
      <rect x="94"   y="-65" width="34" height="38"/>
      <rect x="134"  y="-65" width="34" height="38"/>
      <rect x="174"  y="-65" width="34" height="38"/>
      <rect x="214"  y="-65" width="70" height="38"/>
    </g>

    <!-- Row 3 Keycaps (Spacebar row) -->
    <g fill="#1e293b" stroke="#475569" stroke-width="1.5">
      <rect x="-280" y="-20" width="58" height="38"/>
      <rect x="-216" y="-20" width="42" height="38"/>
      <rect x="-168" y="-20" width="42" height="38"/>
      <rect x="-120" y="-20" width="220" height="38" fill="#f8fafc"/>
      <rect x="106"  y="-20" width="42" height="38"/>
      <rect x="154"  y="-20" width="42" height="38"/>
      <rect x="202"  y="-20" width="82" height="38" fill="#6366f1"/>
    </g>

    <text x="0" y="85" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3">MATRIX 65 • MAGNETIC HALL EFFECT RAPID TRIGGER</text>
  </g>
</svg>
