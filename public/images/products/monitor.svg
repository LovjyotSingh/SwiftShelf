<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="alumM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="screenWallpaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadowMon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgM)"/>

  <g filter="url(#shadowMon)" transform="translate(400, 370)">
    <!-- Aluminum Base Plate -->
    <rect x="-180" y="270" width="360" height="20" rx="8" fill="url(#alumM)"/>

    <!-- Vertical Arm Stand -->
    <rect x="-35" y="50" width="70" height="230" fill="url(#alumM)"/>
    <ellipse cx="0" cy="160" rx="16" ry="24" fill="#0f172a"/>

    <!-- Outer Monitor Frame Bezel -->
    <rect x="-340" y="-220" width="680" height="420" rx="16" fill="#090d16" stroke="url(#alumM)" stroke-width="6"/>

    <!-- 6K OLED Active Display Panel -->
    <rect x="-330" y="-210" width="660" height="390" rx="10" fill="url(#screenWallpaper)"/>

    <!-- Code Editor UI Simulation on Screen -->
    <rect x="-310" y="-190" width="620" height="350" rx="8" fill="#07090e" fill-opacity="0.85"/>
    
    <!-- Code Window Controls -->
    <circle cx="-290" cy="-170" r="6" fill="#ef4444"/>
    <circle cx="-272" cy="-170" r="6" fill="#f59e0b"/>
    <circle cx="-254" cy="-170" r="6" fill="#10b981"/>

    <!-- Code Lines -->
    <rect x="-290" y="-140" width="220" height="12" rx="4" fill="#6366f1"/>
    <rect x="-290" y="-115" width="380" height="12" rx="4" fill="#38bdf8"/>
    <rect x="-270" y="-90" width="310" height="12" rx="4" fill="#a855f7"/>
    <rect x="-270" y="-65" width="240" height="12" rx="4" fill="#10b981"/>
    <rect x="-290" y="-40" width="420" height="12" rx="4" fill="#e2e8f0"/>

    <text x="0" y="145" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="3">LUMINA STUDIO 32" • 6K RETINA OLED</text>
  </g>
</svg>
