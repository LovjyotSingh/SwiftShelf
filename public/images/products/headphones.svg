<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgHeadphones" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgHeadphones)"/>

  <!-- Shadow Floor -->
  <ellipse cx="400" cy="680" rx="220" ry="35" fill="#000" opacity="0.6"/>

  <g filter="url(#shadowH)">
    <!-- Headband Cushion Arc -->
    <path d="M 220 380 C 220 160, 580 160, 580 380" fill="none" stroke="#0f172a" stroke-width="44" stroke-linecap="round"/>
    <path d="M 230 370 C 230 180, 570 180, 570 370" fill="none" stroke="#1e1b4b" stroke-width="24" stroke-linecap="round"/>
    <path d="M 250 360 C 250 200, 550 200, 550 360" fill="none" stroke="url(#cyanAccent)" stroke-width="3" stroke-dasharray="8 6"/>

    <!-- Left & Right Aluminum Yoke Brackets -->
    <path d="M 215 360 L 215 420 C 215 460, 180 460, 180 490" fill="none" stroke="url(#metalTitanium)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 585 360 L 585 420 C 585 460, 620 460, 620 490" fill="none" stroke="url(#metalTitanium)" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Ear Cup assembly -->
    <g transform="translate(180, 500) rotate(-12)">
      <!-- Outer Shell -->
      <ellipse cx="0" cy="0" rx="75" ry="105" fill="#0f172a" stroke="url(#metalTitanium)" stroke-width="6"/>
      <!-- Planar Magnetic Ring Accent -->
      <ellipse cx="0" cy="0" rx="55" ry="80" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <!-- Protein Memory Foam Cushion -->
      <ellipse cx="-15" cy="0" rx="50" ry="75" fill="#1e293b" stroke="#334155" stroke-width="4"/>
      <!-- Driver Mesh -->
      <ellipse cx="-15" cy="0" rx="30" ry="50" fill="#020617"/>
      <circle cx="-15" cy="0" r="12" fill="#6366f1" opacity="0.6"/>
    </g>

    <!-- Right Ear Cup assembly -->
    <g transform="translate(620, 500) rotate(12)">
      <!-- Outer Shell -->
      <ellipse cx="0" cy="0" rx="75" ry="105" fill="#0f172a" stroke="url(#metalTitanium)" stroke-width="6"/>
      <!-- Planar Magnetic Ring Accent -->
      <ellipse cx="0" cy="0" rx="55" ry="80" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <!-- Protein Memory Foam Cushion -->
      <ellipse cx="15" cy="0" rx="50" ry="75" fill="#1e293b" stroke="#334155" stroke-width="4"/>
      <!-- Driver Mesh -->
      <ellipse cx="15" cy="0" rx="30" ry="50" fill="#020617"/>
      <circle cx="15" cy="0" r="12" fill="#6366f1" opacity="0.6"/>
    </g>

    <!-- Branding Text -->
    <text x="400" y="270" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="4">SPECTRE PRO ANC</text>
  </g>
</svg>
