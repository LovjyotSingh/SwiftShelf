<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgMOU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="magnesium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowMs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgMOU)"/>

  <g filter="url(#shadowMs)" transform="translate(400, 390)">
    <!-- Outer Magnesium Alloy Shell -->
    <path d="M 0 -220 C 90 -220, 135 -140, 135 0 C 135 150, 90 220, 0 220 C -90 220, -135 150, -135 0 C -135 -140, -90 -220, 0 -220 Z" 
          fill="url(#magnesium)" stroke="#38bdf8" stroke-width="4"/>

    <!-- Left & Right Main Buttons Split -->
    <line x1="0" y1="-220" x2="0" y2="-60" stroke="#07090e" stroke-width="5"/>

    <!-- Aluminum Scroll Wheel -->
    <rect x="-14" y="-160" width="28" height="60" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <line x1="-14" y1="-140" x2="14" y2="-140" stroke="#475569" stroke-width="2"/>
    <line x1="-14" y1="-120" x2="14" y2="-120" stroke="#475569" stroke-width="2"/>

    <!-- Magnesium Exoskeleton Honeycomb Cutouts -->
    <polygon points="0,-20 -20,0 0,20 20,0" fill="#07090e" stroke="#334155" stroke-width="1.5"/>
    <polygon points="-40,20 -60,40 -40,60 -20,40" fill="#07090e" stroke="#334155" stroke-width="1.5"/>
    <polygon points="40,20 20,40 40,60 60,40" fill="#07090e" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,60 -20,80 0,100 20,80" fill="#07090e" stroke="#334155" stroke-width="1.5"/>

    <!-- Apex Ultra Branding -->
    <text x="0" y="150" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3">APEX ULTRA • 49g MAGNESIUM</text>
  </g>
</svg>
