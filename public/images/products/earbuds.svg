<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBuds" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titanCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadowBd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bgBuds)"/>

  <g filter="url(#shadowBd)" transform="translate(400, 420)">
    <!-- Titanium Charging Case Open Base -->
    <rect x="-160" y="-60" width="320" height="220" rx="45" fill="url(#titanCase)" stroke="#1e293b" stroke-width="6"/>

    <!-- Inner Charging Wells -->
    <ellipse cx="-80" cy="0" rx="55" ry="40" fill="#07090e" stroke="#334155" stroke-width="3"/>
    <ellipse cx="80" cy="0" rx="55" ry="40" fill="#07090e" stroke="#334155" stroke-width="3"/>

    <!-- Left Titanium Earbud Floating -->
    <g transform="translate(-80, -90) rotate(-15)">
      <circle cx="0" cy="0" r="42" fill="url(#titanCase)" stroke="#38bdf8" stroke-width="3"/>
      <path d="M 0 35 L 0 85" stroke="url(#titanCase)" stroke-width="16" stroke-linecap="round"/>
      <circle cx="-15" cy="0" r="14" fill="#020617"/>
    </g>

    <!-- Right Titanium Earbud Floating -->
    <g transform="translate(80, -90) rotate(15)">
      <circle cx="0" cy="0" r="42" fill="url(#titanCase)" stroke="#38bdf8" stroke-width="3"/>
      <path d="M 0 35 L 0 85" stroke="url(#titanCase)" stroke-width="16" stroke-linecap="round"/>
      <circle cx="15" cy="0" r="14" fill="#020617"/>
    </g>

    <text x="0" y="125" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3">PULSE ANC • DUAL MICRO-PLANAR</text>
  </g>
</svg>
